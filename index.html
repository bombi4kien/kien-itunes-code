<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhận iTunes Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-xl text-center border border-slate-700">
    <h1 class="text-xl font-bold mb-2">SỰ KIỆN NHẬN ITUNES CODE</h1>
    <p id="countdown" class="text-sm text-yellow-400 mb-6">Đang kiểm tra thời gian...</p>

    <div class="bg-slate-950 p-6 rounded-xl border border-slate-800 mb-6">
      <p class="text-xs text-gray-400 mb-2 uppercase tracking-wide">Mã của bạn</p>
      <div id="codeDisplay" class="text-xl font-mono font-bold text-green-400 break-all select-all">
        ------ ------ ------
      </div>
    </div>

    <button id="btnClaim" onclick="nhanCode()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl transition duration-200 disabled:bg-gray-600 disabled:cursor-not-allowed">
      Nhận Code Ngay
    </button>
    <p id="errorMsg" class="text-red-400 text-xs mt-3 hidden"></p>
  </div>

  <script>
    // --- CẤU HÌNH CỦA BẠN ---
    // 1. Dán URL Apps Script lấy ở Bước 1 vào giữa 2 dấu ngoặc kép:
    const API_URL = "https://script.google.com/macros/s/AKfycbx1szEqP_X_cZKOTQLsUkvKzCGJgS-T747vRB9Kh48Yl7MV8LAhNsea_r4oqugl8D4M5A/exec";

    // 2. Chỉnh ngày giờ bắt đầu phát (Năm, Tháng - 1, Ngày, Giờ, Phút)
    // Lưu ý: Tháng trong JS tính từ 0 đến 11 (Tháng 9 thì ghi số 8)
    const OPEN_TIME = new Date(2026, 8, 24, 19, 15, 0).getTime();
    // ------------------------

    const btn = document.getElementById("btnClaim");
    const countdown = document.getElementById("countdown");
    const codeDisplay = document.getElementById("codeDisplay");
    const errorMsg = document.getElementById("errorMsg");

    function capNhatDongHo() {
      const now = Date.now();
      const diff = OPEN_TIME - now;

      if (diff > 0) {
        btn.disabled = true;
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const hours = Math.floor(diff / (1000 * 60 * 60));
        countdown.innerText = `Hệ thống mở phát sau: ${hours} giờ ${minutes} phút nữa!`;
      } else {
        countdown.innerText = "Hệ thống đã mở! Bấm để nhận mã.";
        if (!localStorage.getItem("da_nhan_code")) {
          btn.disabled = false;
        }
      }
    }

    setInterval(capNhatDongHo, 1000);
    capNhatDongHo();

    // Kiểm tra xem máy này đã từng bấm nhận chưa
    if (localStorage.getItem("da_nhan_code")) {
      codeDisplay.innerText = localStorage.getItem("da_nhan_code");
      btn.disabled = true;
      btn.innerText = "Bạn đã nhận mã rồi";
    }

    async function nhanCode() {
      btn.disabled = true;
      btn.innerText = "Đang xử lý...";
      errorMsg.classList.add("hidden");

      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        if (data.code) {
          codeDisplay.innerText = data.code;
          localStorage.setItem("da_nhan_code", data.code);
          btn.innerText = "Đã nhận thành công!";
        } else {
          codeDisplay.innerText = "HẾT MÃ!";
          errorMsg.innerText = "Toàn bộ số lượng mã quà tặng đã được phát hết.";
          errorMsg.classList.remove("hidden");
          btn.innerText = "Đã hết code";
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = "Thử lại";
        errorMsg.innerText = "Mạng yếu hoặc có lỗi xảy ra, hãy thử lại.";
        errorMsg.classList.remove("hidden");
      }
    }
  </script>
</body>
</html>
