<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIEN's DEBUT - Nhận iTunes Code Miễn Phí</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #28060a 0%, #0d0204 100%);
    }
  </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-sm w-full space-y-4 my-6">

    <!-- KHỐI 1: BANNER, ĐỒNG HỒ ĐẾM NGƯỢC, FORM NHẬP TÊN VÀ NÚT NHẬN -->
    <div class="bg-[#140608] rounded-2xl p-5 border border-[#3b1218] shadow-2xl shadow-red-950/50">
      
      <!-- ẢNH BÌA BANNER -->
      <div class="overflow-hidden rounded-xl mb-4 border border-[#4a181f]">
        <img 
          src="banner.JPG" 
          alt="KIEN's DEBUT" 
          class="w-full h-auto object-cover block"
          onerror="this.onerror=null; this.src='banner.png';"
        />
      </div>

      <!-- Tiêu đề sự kiện -->
      <div class="flex items-center justify-center gap-2 mb-3">
        <span class="text-xl text-red-500">🎁</span>
        <h2 class="text-lg font-bold tracking-wide text-gray-100">Nhận iTunes Code</h2>
      </div>

      <!-- ĐỒNG HỒ ĐẾM NGƯỢC -->
      <div id="countdownBox" class="mb-5 bg-[#1c080b] border border-[#44171d] rounded-xl p-3 text-center">
        <p class="text-xs text-red-400 font-semibold mb-2 uppercase tracking-wider">Hệ thống mở phát sau</p>
        <div class="grid grid-cols-4 gap-2 text-center font-mono">
          <div class="bg-[#240a0e] rounded-lg p-1.5 border border-[#4a181f]">
            <span id="days" class="text-lg font-bold text-white block">00</span>
            <span class="text-[10px] text-gray-400">NGÀY</span>
          </div>
          <div class="bg-[#240a0e] rounded-lg p-1.5 border border-[#4a181f]">
            <span id="hours" class="text-lg font-bold text-white block">00</span>
            <span class="text-[10px] text-gray-400">GIỜ</span>
          </div>
          <div class="bg-[#240a0e] rounded-lg p-1.5 border border-[#4a181f]">
            <span id="minutes" class="text-lg font-bold text-white block">00</span>
            <span class="text-[10px] text-gray-400">PHÚT</span>
          </div>
          <div class="bg-[#240a0e] rounded-lg p-1.5 border border-[#4a181f]">
            <span id="seconds" class="text-lg font-bold text-red-400 block">00</span>
            <span class="text-[10px] text-gray-400">GIÂY</span>
          </div>
        </div>
      </div>

      <!-- Thông báo khi đã đến giờ -->
      <p id="openedNotice" class="text-xs text-center text-green-400 font-medium mb-4 hidden">
        🎉 Hệ thống đã mở! Nhập tên để nhận code ngay.
      </p>

      <!-- Ô nhập tên -->
<div class="space-y-1.5 mb-4">
  <label for="userName" class="block text-center text-xs text-gray-400 font-medium">
    Người nhận mã
    <br>
    Vui lòng chỉ nhận 1 mã/1 tài khoản
  </label>
        <input
          type="text"
          id="userName"
          placeholder="Tên bạn/Tên Fandom"
          class="w-full bg-[#1c080b] border border-[#44171d] rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-red-500 transition"
        />
      </div>

      <!-- Nút nhận code -->
      <button
        id="btnClaim"
        onclick="nhanCode()"
        class="w-full bg-red-600 hover:bg-red-500 active:scale-[0.98] disabled:bg-[#331116] disabled:text-neutral-500 disabled:cursor-not-allowed font-bold py-3.5 rounded-xl transition duration-200 flex items-center justify-center gap-2 text-sm shadow-lg shadow-red-900/40"
      >
        <span>🎁</span>
        <span id="btnText">Nhận iTunes Code</span>
      </button>

      <p id="errorMsg" class="text-red-400 text-xs text-center mt-2.5 hidden"></p>
    </div>

    <!-- KHỐI 2: KHUNG HIỂN THỊ CODE VÀ NÚT COPY -->
    <div class="bg-[#140608] rounded-2xl p-5 border border-[#3b1218] shadow-2xl shadow-red-950/50 space-y-3.5">
      <div class="flex items-center gap-2 text-xs font-bold tracking-wider text-red-500">
        <span>🎁</span>
        <span>CODE CỦA BẠN</span>
      </div>

      <div class="bg-[#1c080b] border border-[#44171d] rounded-xl py-3.5 px-4 text-center">
        <div id="codeDisplay" class="font-mono font-bold text-base tracking-widest text-red-100 select-all">
          ------ ------ ------
        </div>
      </div>

      <button
        id="btnCopy"
        onclick="copyCode()"
        class="w-full bg-[#240a0e] hover:bg-[#330f14] active:scale-[0.98] border border-[#4a181f] font-medium py-3 rounded-xl transition duration-200 flex items-center justify-center gap-2 text-xs text-neutral-200"
      >
        <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
        <span id="copyText">Copy Code</span>
      </button>
    </div>

  </div>

  <script>
    // ================== CẤU HÌNH Ở ĐÂY ==================
    // 1. Dán URL Apps Script của bạn vào đây:
    const API_URL = "DÁN_URL_GOOGLE_APPS_SCRIPT_CỦA_BẠN_VÀO_ĐÂY";

    // 2. CHỈNH NGÀY GIỜ MỞ PHÁT CODE TẠI ĐÂY:
    // Cú pháp: new Date(Năm, Tháng - 1, Ngày, Giờ, Phút, Giây)
    // Ví dụ: Mở lúc 20:00 ngày 30 tháng 9 năm 2026 -> Tháng 9 điền số 8
    const OPEN_TIME = new Date(2026, 11, 19, 0, 0, 0).getTime();
    // ====================================================

    const btn = document.getElementById("btnClaim");
    const btnText = document.getElementById("btnText");
    const userNameInput = document.getElementById("userName");
    const countdownBox = document.getElementById("countdownBox");
    const openedNotice = document.getElementById("openedNotice");
    const codeDisplay = document.getElementById("codeDisplay");
    const errorMsg = document.getElementById("errorMsg");
    const copyText = document.getElementById("copyText");

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    function capNhatDongHo() {
      const now = Date.now();
      const diff = OPEN_TIME - now;

      if (diff > 0) {
        btn.disabled = true;
        countdownBox.classList.remove("hidden");
        openedNotice.classList.add("hidden");

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / (1000 * 60)) % 60);
        const s = Math.floor((diff / 1000) % 60);

        daysEl.innerText = String(d).padStart(2, '0');
        hoursEl.innerText = String(h).padStart(2, '0');
        minutesEl.innerText = String(m).padStart(2, '0');
        secondsEl.innerText = String(s).padStart(2, '0');
      } else {
        countdownBox.classList.add("hidden");
        openedNotice.classList.remove("hidden");
        if (!localStorage.getItem("da_nhan_code")) {
          btn.disabled = false;
        }
      }
    }

    setInterval(capNhatDongHo, 1000);
    capNhatDongHo();

    if (localStorage.getItem("da_nhan_code")) {
      codeDisplay.innerText = localStorage.getItem("da_nhan_code");
      userNameInput.value = localStorage.getItem("ten_nguoi_nhan") || "";
      userNameInput.disabled = true;
      btn.disabled = true;
      btnText.innerText = "Bạn đã nhận mã rồi";
    }

    async function nhanCode() {
      const name = userNameInput.value.trim();
      if (!name) {
        errorMsg.innerText = "Vui lòng nhập Tên bạn hoặc Tên Fandom!";
        errorMsg.classList.remove("hidden");
        userNameInput.focus();
        return;
      }

      btn.disabled = true;
      btnText.innerText = "Đang lấy code...";
      errorMsg.classList.add("hidden");

      try {
        const res = await fetch(`${API_URL}?name=${encodeURIComponent(name)}`);
        const data = await res.json();

        if (data.code) {
          codeDisplay.innerText = data.code;
          localStorage.setItem("da_nhan_code", data.code);
          localStorage.setItem("ten_nguoi_nhan", name);
          userNameInput.disabled = true;
          btnText.innerText = "Đã nhận thành công!";
        } else {
          codeDisplay.innerText = "HẾT MÃ!";
          errorMsg.innerText = "Toàn bộ số lượng mã quà tặng đã được phát hết.";
          errorMsg.classList.remove("hidden");
          btnText.innerText = "Đã hết code";
        }
      } catch (err) {
        btn.disabled = false;
        btnText.innerText = "Thử lại";
        errorMsg.innerText = "Mạng yếu hoặc có lỗi xảy ra, hãy thử lại.";
        errorMsg.classList.remove("hidden");
      }
    }

    function copyCode() {
      const code = codeDisplay.innerText.trim();
      if (!code || code === "------ ------ ------" || code === "HẾT MÃ!") {
        alert("Chưa có mã để sao chép!");
        return;
      }

      navigator.clipboard.writeText(code).then(() => {
        copyText.innerText = "Đã Copy!";
        setTimeout(() => {
          copyText.innerText = "Copy Code";
        }, 2000);
      }).catch(() => {
        const temp = document.createElement("textarea");
        temp.value = code;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        copyText.innerText = "Đã Copy!";
        setTimeout(() => {
          copyText.innerText = "Copy Code";
        }, 2000);
      });
    }
  </script>
</body>
</html>
